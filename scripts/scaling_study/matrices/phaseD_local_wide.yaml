# Phase D (local, WIDE) -- data-exchange law over a district-scale range.
#
# Supersedes the range of phaseD_local.yaml (which the Sec.8.7 autonomous gate
# capped at F=2/N=4/M=4/ticks=30, reaching only max_fed_in=16). User cleared the
# gate 2026-07-28 for N<=32, M<=64, ticks=300 on the idle manager.
#
# Designed for IDENTIFIABILITY, not coverage. The Sec.8.7-capped run could not
# separate the regressors: cross_fed all2all has max_fed_in == max_fed_out in
# every cell, so in/out coefficients were collinear and the fit clamped one to
# zero. Here:
#   W1 sweeps M at fixed N -> max_fed_in = 4M (4..256) with handle width fixed
#   W2 sweeps N at fixed M -> varies targets-per-handle instead of instances,
#      breaking the M/handle-width confound W1 alone leaves
#   W3 Nto1/1toN/1to1 at two load levels -> in and out move INDEPENDENTLY,
#      the only cells that identify the in-vs-out asymmetry (measured 3.7x)
#   W4/W5 payload and cadence; W6 causality; W7 intra_fed mirror of W1/W2
# Extremes are deliberately not crossed (no N=32 x M=64): that cell would
# register ~131k edges and measures registration blowup, not per-tick cost.
#
# Every wired (N,M) has a matching exchange=none CONTROL -- the fit is a paired
# delta and silently drops wired rows whose control is missing.
#
# DELETE the target CSV before running: run_bench.py APPENDS.
