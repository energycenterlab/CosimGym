# COMBO scenario: DIST + PARALLEL.
# Two heavy_compute_dummy federates (self-contained, no pub/sub): one runs on the
# manager, one is spawned on a remote machine over SSH (localhost-as-remote by
# default). BOTH use instantiation.parallel_execution so per-federate model
# instances are stepped in persistent worker processes — exercising remote SSH
# spawning and process-based parallel model execution together.
# Small iterations + short span keep it fast for the regression suite.
# Edit the deployment block for real machines. Uses zmq_ss (NAT-safe).

version: "1.0.0"
name: "combo_dist_parallel"
scenario_description: COMBO distributed (remote SSH) + parallel model execution.

start_time: "2024-01-01T00:00:00"
end_time:   "2024-01-01T00:00:05"
log_level: ERROR

memory_config:
  sink: none
  attrs: "all"

deployment:
  manager_address: "127.0.0.1"
  machines:
    remote_box:
      host: "127.0.0.1"
      ssh_port: 22
      workdir: "/tmp/cosimgym_remote_test"
      conda_env: "cosim_gym"
      python: "/media/space/rando/Environments/cosim_gym/bin/python"

federations:
  federation_1:
    broker_config:
      core_type: "zmq_ss"
      federates: 2
      log_level: ERROR

    federate_configs:

      heavy_local:
        name: "heavy_local"
        type: "base"
        log_level: ERROR
        core_type: "zmq_ss"
        timing_configs:
          real_period: 1
        flags:
          terminate_on_error: true
          wait_for_current_time_update: false
        connections:
          endpoints: []
          subscribes: []
          publishes:
            - key: "result"
              type: "double"
              units: "-"
        model_configs:
          instantiation:
            model_name: "heavy_compute_dummy"
            n_instances: 4
            prefix: "hl"
            parallel_execution: true
            max_parallel_workers: 4
          parameters:
            iterations: 10000
          init_state: {}
          user_defined: {}

      heavy_remote:
        name: "heavy_remote"
        type: "base"
        host: "remote_box"          # spawned on remote_box over ssh
        log_level: ERROR
        core_type: "zmq_ss"
        timing_configs:
          real_period: 1
        flags:
          terminate_on_error: true
          wait_for_current_time_update: false
        connections:
          endpoints: []
          subscribes: []
          publishes:
            - key: "result"
              type: "double"
              units: "-"
        model_configs:
          instantiation:
            model_name: "heavy_compute_dummy"
            n_instances: 4
            prefix: "hr"
            parallel_execution: true
            max_parallel_workers: 4
          parameters:
            iterations: 10000
          init_state: {}
          user_defined: {}
