version: "1.0.0"
name: "dh_district_jan_base"
scenario_description: >
  District-heating co-simulation (no RL). 10 heterogeneous RC (5R1C, ISO 13790)
  buildings act as heat consumers; each building's heating demand (Q_heating, W)
  drives a heat_consumer element of a pandapipes water district-heating network
  (thermal/bidirectional pipeflow). Real Turin January weather (15-min) and a
  time-of-day occupancy/set-point scheduler provide boundary conditions.
  Simulated over the full month of January at a 15-minute step.

start_time: "2010-01-01T00:00:00"
end_time:   "2010-02-01T00:00:00"
log_level: ERROR

# 15-min step over 31 days = 2976 steps. "all" keeps every input/output in memory
# (dumped to JSON at the end); at this scale the footprint is modest.
memory_config:
  sink: parquet
  batch_size: 1000
  attrs: "all"

synchronization:
  auto_offset:
    enabled: true
    offset_step: 0.1
    override_existing_offsets: false
  default_subscription_causality: "same_step"
  validate_causality_cycles: true
  default_startup_sync:
    enabled: true
    force_read_all_subscriptions: true
    require_updated_inputs: false
    missing_inputs_policy: "warn"

federations:
  federation_1:
    broker_config:
      core_type: "zmq"
      port: 23440
      host: "localhost"
      federates: 4
      log_level: ERROR

    federate_configs:

      # ----------------------------------------------------------------------
      # Weather source — streams real Turin outdoor temperature (15-min rows).
      # ----------------------------------------------------------------------
      weather_federate:
        name: "weather_federate"
        type: "base"
        log_level: ERROR
        core_name: "fed_weather"
        core_type: "zmq"
        timing_configs:
          real_period: 900
        flags:
          terminate_on_error: true
          wait_for_current_time_update: false
        connections:
          endpoints: []
          subscribes: []
          publishes:
            - key: "T_ext"
              type: "double"
              units: "°C"
        model_configs:
          instantiation:
            model_name: "weather_csv_reader"
            n_instances: 1
            prefix: "weather"
            parallel_execution: false
          parameters:
            csv_path: "resources/weather_TO.csv"
            column: "T_ext"
            skip_rows: 0
          init_state:
            T_ext: 3.0
          user_defined: {}

      # ----------------------------------------------------------------------
      # Scheduler — time-of-day occupancy / set-point + internal-gain schedules.
      # ----------------------------------------------------------------------
      scheduler_federate:
        name: "scheduler_federate"
        type: "base"
        log_level: ERROR
        core_name: "fed_scheduler"
        core_type: "zmq"
        timing_configs:
          real_period: 900
        flags:
          terminate_on_error: true
          wait_for_current_time_update: false
        connections:
          endpoints: []
          subscribes: []
          publishes:
            - key: "ZoneSetPoint"
              type: "double"
              units: "°C"
            - key: "LightsWatt"
              type: "double"
              units: "W"
            - key: "EEquipWatt"
              type: "double"
              units: "W"
            - key: "OthEquRadWatt"
              type: "double"
              units: "W"
            - key: "OthEquFCWatt"
              type: "double"
              units: "W"
        model_configs:
          instantiation:
            model_name: "bui0_input_feeder"
            n_instances: 1
            prefix: "sched"
            parallel_execution: false
          parameters:
            occupied_start_hour: 7.0
            occupied_end_hour: 22.0
            people_occupied: 4.0
            lights_peak_w: 400.0
            lights_base_w: 40.0
            eequip_peak_w: 500.0
            eequip_base_w: 50.0
            otheq_rad_peak_w: 100.0
            otheq_rad_base_w: 0.0
            otheq_fc_peak_w: 100.0
            otheq_fc_base_w: 0.0
            setpoint_day_c: 21.0
            setpoint_night_c: 18.0
          init_state: {}
          user_defined: {}

      # ----------------------------------------------------------------------
      # 10 heterogeneous RC buildings (heat consumers). Each instance i
      # publishes Q_heating.<i> which drives heat_consumer.<i>.qext_w.
      # Geometry scaled from floor_area for physical consistency.
      # ----------------------------------------------------------------------
      building_federate:
        name: "building_federate"
        type: "base"
        log_level: ERROR
        core_name: "fed_buildings"
        core_type: "zmq"
        timing_configs:
          real_period: 900
        flags:
          terminate_on_error: true
          wait_for_current_time_update: false
        connections:
          endpoints: []
          subscribes:
            - key: "T_ext"
              type: "double"
              units: "°C"
              targets:
                '0': [weather_federate.0/T_ext]
                '1': [weather_federate.0/T_ext]
                '2': [weather_federate.0/T_ext]
                '3': [weather_federate.0/T_ext]
                '4': [weather_federate.0/T_ext]
                '5': [weather_federate.0/T_ext]
                '6': [weather_federate.0/T_ext]
                '7': [weather_federate.0/T_ext]
                '8': [weather_federate.0/T_ext]
                '9': [weather_federate.0/T_ext]
            - key: "t_set_heating"
              type: "double"
              units: "°C"
              targets:
                '0': [scheduler_federate.0/ZoneSetPoint]
                '1': [scheduler_federate.0/ZoneSetPoint]
                '2': [scheduler_federate.0/ZoneSetPoint]
                '3': [scheduler_federate.0/ZoneSetPoint]
                '4': [scheduler_federate.0/ZoneSetPoint]
                '5': [scheduler_federate.0/ZoneSetPoint]
                '6': [scheduler_federate.0/ZoneSetPoint]
                '7': [scheduler_federate.0/ZoneSetPoint]
                '8': [scheduler_federate.0/ZoneSetPoint]
                '9': [scheduler_federate.0/ZoneSetPoint]
            - key: "internal_gains"
              type: "double"
              units: "W"
              multi_input_handling: "sum"
              targets:
                '0': &gains [scheduler_federate.0/LightsWatt, scheduler_federate.0/EEquipWatt, scheduler_federate.0/OthEquRadWatt, scheduler_federate.0/OthEquFCWatt]
                '1': *gains
                '2': *gains
                '3': *gains
                '4': *gains
                '5': *gains
                '6': *gains
                '7': *gains
                '8': *gains
                '9': *gains
          publishes:
            - key: "Q_heating"
              type: "double"
              units: "W"
            - key: "T_indoor"
              type: "double"
              units: "°C"
        model_configs:
          instantiation:
            model_name: "rc_building"
            n_instances: 10
            prefix: "bld"
            parallel_execution: false
          parameters:
            floor_area:                          [80,    120,    150,    200,    95,    300,    180,    110,    250,    140]
            room_vol:                            [240,   360,    450,    600,    285,   900,    540,    330,    750,    420]
            total_internal_area:                 [360,   540,    675,    900,    427,   1350,   810,    495,    1125,   630]
            walls_area:                          [40,    60,     75,     100,    48,    150,    90,     55,     125,    70]
            window_area:                         [12,    18,     22,     30,     14,    45,     27,     16,     37,     21]
            u_walls:                             [0.20,  0.35,   0.28,   0.15,   0.40,  0.18,   0.25,   0.32,   0.16,   0.30]
            u_windows:                           [1.1,   2.0,    1.4,    0.9,    2.4,   1.0,    1.3,    1.8,    0.9,    1.6]
            thermal_capacitance_per_floor_area:  [165000, 120000, 200000, 165000, 90000, 260000, 165000, 110000, 220000, 140000]
            t_m_initial:                         [18,    17,     19,     20,     16,    18,     19,     17,     20,     18]
            t_set_heating: 21.0
            t_set_cooling: 26.0
            cop_heating: 3.0
          init_state:
            T_ext: 3.0
            t_set_heating: 21.0
            internal_gains: 0.0
            Q_heating: 0.0
            T_indoor: 18.0
          user_defined: {}

      # ----------------------------------------------------------------------
      # District-heating network (pandapipes, thermal). 10 heat_consumer
      # elements fed by the building heat demands.
      # ----------------------------------------------------------------------
      dh_network_federate:
        name: "dh_network_federate"
        type: "base"
        log_level: ERROR
        core_name: "fed_dh"
        core_type: "zmq"
        timing_configs:
          real_period: 900
        flags:
          terminate_on_error: true
          wait_for_current_time_update: false
        connections:
          endpoints: []
          subscribes:
            - key: "heat_consumer.0.qext_w"
              type: "double"
              units: "W"
              targets: {'0': [building_federate.0/Q_heating]}
            - key: "heat_consumer.1.qext_w"
              type: "double"
              units: "W"
              targets: {'0': [building_federate.1/Q_heating]}
            - key: "heat_consumer.2.qext_w"
              type: "double"
              units: "W"
              targets: {'0': [building_federate.2/Q_heating]}
            - key: "heat_consumer.3.qext_w"
              type: "double"
              units: "W"
              targets: {'0': [building_federate.3/Q_heating]}
            - key: "heat_consumer.4.qext_w"
              type: "double"
              units: "W"
              targets: {'0': [building_federate.4/Q_heating]}
            - key: "heat_consumer.5.qext_w"
              type: "double"
              units: "W"
              targets: {'0': [building_federate.5/Q_heating]}
            - key: "heat_consumer.6.qext_w"
              type: "double"
              units: "W"
              targets: {'0': [building_federate.6/Q_heating]}
            - key: "heat_consumer.7.qext_w"
              type: "double"
              units: "W"
              targets: {'0': [building_federate.7/Q_heating]}
            - key: "heat_consumer.8.qext_w"
              type: "double"
              units: "W"
              targets: {'0': [building_federate.8/Q_heating]}
            - key: "heat_consumer.9.qext_w"
              type: "double"
              units: "W"
              targets: {'0': [building_federate.9/Q_heating]}
          publishes:
            - key: "convergence"
              type: "double"
              units: "-"
            - key: "res.junction.0.t_k"
              type: "double"
              units: "K"
            - key: "res.junction.1.t_k"
              type: "double"
              units: "K"
            - key: "res.heat_consumer.0.t_outlet_k"
              type: "double"
              units: "K"
            - key: "res.heat_consumer.1.t_outlet_k"
              type: "double"
              units: "K"
            - key: "res.heat_consumer.2.t_outlet_k"
              type: "double"
              units: "K"
            - key: "res.heat_consumer.3.t_outlet_k"
              type: "double"
              units: "K"
            - key: "res.heat_consumer.4.t_outlet_k"
              type: "double"
              units: "K"
            - key: "res.heat_consumer.5.t_outlet_k"
              type: "double"
              units: "K"
            - key: "res.heat_consumer.6.t_outlet_k"
              type: "double"
              units: "K"
            - key: "res.heat_consumer.7.t_outlet_k"
              type: "double"
              units: "K"
            - key: "res.heat_consumer.8.t_outlet_k"
              type: "double"
              units: "K"
            - key: "res.heat_consumer.9.t_outlet_k"
              type: "double"
              units: "K"
        model_configs:
          instantiation:
            model_name: "pandapipes_grid"
            n_instances: 1
            prefix: "dh"
            parallel_execution: false
          parameters:
            case_file: "resources/dh_network_10.json"
            case_file_format: "json"
            pf_mode: "bidirectional"
            max_iter_hyd: 20
            max_iter_therm: 20
            friction_model: "nikuradse"
            fail_on_divergence: false
          init_state: {}
          user_defined: {}
