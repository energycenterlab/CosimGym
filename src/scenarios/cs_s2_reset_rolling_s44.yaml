version: 1.0.0
name: cs_s2_reset_rolling_s44
scenario_description: "Paper case study S2 (Part B): reset-strategy benchmark, mode=rolling\
  \ (window=10) \u2014 SAC RL agent, otherwise identical to cs_s2_sac.yaml."
start_time: '2024-01-01T00:00:00'
end_time: '2024-01-02T00:00:00'
log_level: ERROR
memory_config:
  batch_size: 1000
  attrs:
  - T_indoor
  - T_ext
  - Q_heat
  - P_elec
  - COP
  - modulation
reinforcement_learning_config:
  seed: 44
  environment:
    observations:
      federation_1.weather.0.T_ext:
        reset_default: 3.0
      federation_1.building.0.T_indoor:
        causality: next_step
        reset_default: 18.0
    actions:
      federation_1.heatpump.0.modulation: null
    reward: models.model_catalog.RL_agents.reward_functions.building_heatpump_comfort
    reset:
      mode: rolling
      rolling_window: 10
  agent:
    model_name: rl_simple_SACsb3
    backend: stable_baselines3
    algorithm: SAC
    hyperparameters:
      gamma: 0.99
      batch_size: 64
      learning_rate: 0.001
      train_frequency: 100
      gradient_steps: 1
    params:
      gradient_clip: 10.0
      target_update_interval: 5
      replay_buffer:
        buffer_size: 100000
        prefill_steps: 2880
  run:
    train:
      episodes: 100
      episode_length: 2880
    test:
      episodes: 1
      episode_length: 2880
      deterministic: true
  experiment:
    checkpoint:
      best: best_cs_s2_reset_rolling_s44.pth
federations:
  federation_1:
    broker_config:
      core_type: tcp
      host: localhost
      federates: 3
      log_level: ERROR
    federate_configs:
      weather:
        name: weather
        type: base
        log_level: ERROR
        core_name: fed1
        core_type: tcp
        timing_configs:
          real_period: 900
        flags:
          terminate_on_error: true
          wait_for_current_time_update: false
        connections:
          endpoints: []
          subscribes: []
          publishes:
          - key: T_ext
            type: double
            units: "\xB0C"
        model_configs:
          instantiation:
            model_name: weather_csv_reader
            n_instances: 1
            prefix: weather
            parallel_execution: false
          parameters:
            csv_path: resources/weather_TO.csv
            column: T_ext
            skip_rows: 0
          init_state:
            T_ext: 3.0
          user_defined: {}
      heatpump:
        name: heatpump
        type: base
        log_level: ERROR
        core_name: fed1
        core_type: tcp
        timing_configs:
          real_period: 60
          time_offset: 0.2
        flags:
          terminate_on_error: true
          wait_for_current_time_update: false
        connections:
          endpoints: []
          subscribes:
          - key: T_ext
            type: double
            units: "\xB0C"
            targets:
              '0':
              - weather.0/T_ext
          - key: modulation
            type: double
            units: '-'
          publishes:
          - key: Q_heat
            type: double
            units: W
          - key: P_elec
            type: double
            units: W
          - key: COP
            type: double
            units: '-'
        model_configs:
          instantiation:
            model_name: simple_heatpump
            n_instances: 1
            prefix: hp
            parallel_execution: false
          parameters:
            P_rated: 5000.0
            eta_carnot: 0.45
            T_supply: 45.0
            COP_min: 1.5
            COP_max: 6.0
          init_state:
            T_ext: 3.0
            modulation: 0.0
            Q_heat: 0.0
            P_elec: 0.0
            COP: 0.0
          user_defined:
            integrator: fixed-step
      building:
        name: building
        type: base
        log_level: ERROR
        core_name: fed1
        core_type: tcp
        timing_configs:
          real_period: 60
          time_offset: 0.3
        flags:
          terminate_on_error: true
          wait_for_current_time_update: false
        connections:
          endpoints: []
          subscribes:
          - key: T_ext
            type: double
            units: "\xB0C"
            targets:
              '0':
              - weather.0/T_ext
          - key: Q_heat
            type: double
            units: W
            targets:
              '0':
              - heatpump.0/Q_heat
          publishes:
          - key: T_indoor
            type: double
            units: "\xB0C"
        model_configs:
          instantiation:
            model_name: simple_building
            n_instances: 1
            prefix: bldg
            parallel_execution: false
          parameters:
            thermal_capacitance: 5000000.0
            thermal_resistance: 0.005
            T_initial: 18.0
          init_state:
            T_ext: 3.0
            Q_heat: 0.0
            T_indoor: 18.0
          user_defined:
            integrator: euler
