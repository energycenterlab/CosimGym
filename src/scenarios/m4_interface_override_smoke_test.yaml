# M4 interface-federate output/param override smoke test (digitaltwin_interfaces plan):
# dt_bridge_override has two bridges with no HELICS registration at all (scope: output,
# scope: param) — instead it writes bounds-clipped external values into the shared
# Redis override registry. spring_federate opts in via `override_enabled: true`; its
# `_publish_outputs()`/`_apply_param_overrides()` substitute the override when present.
# All three federates are realtime-paced so there's a wall-clock window to inject
# MQTT values mid-run (the override registry is out-of-band from HELICS, so nothing
# HELICS-side forces spring to wait on the bridge — pacing spring itself is what
# gives us a controllable window).

version: "1.0.0"
name: "m4_interface_override_smoke_test"
scenario_description: M4 check — output then parameter override via MQTT mid-run, clipped; disabling restores computed behavior.

start_time: "2024-01-01T00:00:00"
end_time: "2024-01-01T00:00:25"
log_level: DEBUG

memory_config:
  batch_size: 1000
  attrs: ["position", "velocity", "force", "disturbance", "damping"]

federations:
  federation_1:
    broker_config:
      core_type: "zmq"
      port: 23495
      federates: 3
      log_level: DEBUG

    federate_configs:
      spring_federate:
        name: "spring_federate"
        type: "base"
        log_level: DEBUG
        core_name: "fed1"
        core_type: "zmq"

        timing_configs:
          real_period: 1
          rt_lag: 1.0
          rt_lead: 1.0

        flags:
          terminate_on_error: true
          wait_for_current_time_update: true
          realtime: true

        override_enabled: true

        connections:
          endpoints: []
          subscribes:
            - key: "force"
              type: "double"
              units: "N"
              targets:
                '0': [input_federate.0/force]
            - key: "disturbance"
              type: "double"
              units: "N"
              targets:
                '0': [input_federate.0/disturbance]

          publishes:
            - key: "position"
              type: "double"
              units: "N"
            - key: "velocity"
              type: "double"
              units: "N"

        model_configs:
          instantiation:
            model_name: "spring_mass_damper"
            n_instances: 1
            prefix: "spring"
            parallel_execution: false

          parameters:
            mass: 5
            damping: 2.0
            stiffness: 10.0

          init_state:
            force: 10.0
            disturbance: 0.0
            position: 0.0
            velocity: 0.0

          user_defined:
            solver: "rk4"
            integrator: "fixed-step"

      input_federate:
        name: "input_federate"
        type: "base"
        log_level: DEBUG
        core_name: "fed1"
        core_type: "zmq"

        timing_configs:
          real_period: 1
          rt_lag: 1.0
          rt_lead: 1.0

        flags:
          terminate_on_error: true
          realtime: true

        connections:
          endpoints: []
          subscribes: []
          publishes:
            - key: "force"
              type: "double"
              units: "N"
            - key: "disturbance"
              type: "double"
              units: "N"

        model_configs:
          instantiation:
            model_name: "inputs4spring"
            n_instances: 1
            prefix: "input"
            parallel_execution: false

          init_state: {}
          params: {}

      dt_bridge_override:
        name: "dt_bridge_override"
        type: "interface"
        log_level: DEBUG
        core_name: "fed1"
        core_type: "zmq"

        timing_configs:
          real_period: 1
          rt_lag: 1.0
          rt_lead: 1.0

        flags:
          terminate_on_error: true
          realtime: true

        interface_config:
          adapter:
            name: mqtt_adapter
            params:
              client_id: dt_bridge_override
              host: localhost
              port: 11883
          bridges:
            - helics_key: "spring_federate.0/velocity"
              topic: "cosim/m4_smoke/override/velocity"
              bounds: [-0.5, 0.5]
              scope: output
              mode: replace
            - helics_key: "spring_federate.0/damping"
              topic: "cosim/m4_smoke/override/damping"
              bounds: [0.0, 10.0]
              scope: param
              mode: replace
