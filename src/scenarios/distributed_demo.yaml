# Distributed SSH Spawning — Demo Scenario
#
# Byte-identical physics to `pv_batt_test_base.yaml`, except ONE federate
# (`pv_federate`) is tagged `host: local_box` so ScenarioManager spawns it on a
# remote machine over SSH instead of as a local subprocess. Brokers and every
# other federate stay local (v1 placement rule: only federates go remote).
#
# The `deployment.machines.local_box` entry points at 127.0.0.1 — the CI-able
# "localhost-as-remote" pattern: real ssh, real rsync, one physical machine, so
# results MUST match an all-local run of `pv_batt_test_base.yaml` exactly.
#
# One-time prerequisites on the target machine (here = this machine):
#   - passwordless key-based ssh to 127.0.0.1 (see docs/user_guide/distributed_deployment.md)
#   - the `cosim_gym` conda env exists with helics/redis/pydantic installed,
#     OR set `python:` below to an explicit interpreter path (escape hatch).
#   - Redis (manager) reachable from the remote at manager_address:6379.

version: "1.0.0"
name: "distributed_demo"
scenario_description: "Distributed SSH demo — pv_federate spawned remotely on 127.0.0.1, rest local"

start_time: "2024-01-01T00:00:00"
end_time: "2024-01-03T00:00:00"
log_level: ERROR

memory_config:
  batch_size: 1000
  attrs: "all"

# ---------------------------------------------------------------------------
# Distributed deployment block (NEW). Absent → fully local, identical to base.
# ---------------------------------------------------------------------------
deployment:
  manager_address: "127.0.0.1"        # LAN IP remote machines reach; loopback for this demo
  machines:
    local_box:                        # alias referenced by federates' `host:`
      host: "127.0.0.1"               # ssh target
      # user: rando                   # optional, default current user
      ssh_port: 22                    # optional, default 22
      workdir: "/tmp/cosimgym_remote_test"   # remote repo root; code rsync'd here each run
      conda_env: "cosim_gym"          # optional, default "cosim_gym"
      # python: "/media/space/rando/Environments/cosim_gym/bin/python"
      #   ^ optional explicit interpreter; set this if `conda run` is not on the
      #     non-interactive ssh PATH (common) — bypasses conda entirely.

synchronization:
  auto_offset:
    enabled: true
    offset_step: 0.1
    override_existing_offsets: false
  default_subscription_causality: "same_step"
  validate_causality_cycles: true
  default_startup_sync:
    enabled: true
    force_read_all_subscriptions: true
    require_updated_inputs: true
    require_finite_numeric: true
    invalid_numeric_sentinels: [-1.0e49]
    missing_inputs_policy: "warn"
    invalid_inputs_policy: "warn"


federations:
  federation_1:
    broker_config:
      core_type: "zmq"
      port: 23404
      # host omitted → normalized to deployment.manager_address when remote
      # federates are present (so the remote federate can reach the broker).
      federates: 5

    federate_configs:

      # -----------------------------------------------------------------------
      # Weather federate – streams T_ext from CSV (LOCAL)
      # -----------------------------------------------------------------------
      weather_federate:
        name: "weather_federate"
        log_level: ERROR
        type: "base"
        core_name: "fed1"
        core_type: "zmq"

        timing_configs:
          real_period: 3600   # one CSV row per 60 s sim-step

        flags:
          terminate_on_error: true
          wait_for_current_time_update: false

        connections:
          endpoints: []
          subscribes: []
          publishes:
            - key: "DryBulb"
              type: "double"
              units: "°C"
            - key: "GloHorzRad"
              type: "double"
              units: "W/m²"
            - key: "DifHorzRad"
              type: "double"
              units: "W/m²"

        model_configs:
          instantiation:
            model_name: "base_csv_reader"
            n_instances: 1
            prefix: "weather"
            parallel_execution: false

          parameters:
            csv_path: "model_catalog/physical_models/resources/weather_data_bj.csv"  # relative to model script dir
            skip_rows: 0

          init_state:
            DryBulb: 3.0
            GloHorzRad: 0.0
            DifHorzRad: 0.0

          user_defined: {}

      # -----------------------------------------------------------------------
      # Rule-based controller federate (LOCAL)
      # -----------------------------------------------------------------------
      rb_controller:
        name: "rb_controller"
        type: "base"
        core_name: "fed2"
        core_type: "zmq"
        log_level: ERROR


        timing_configs:
          real_period: 3600
          time_offset: 0.3


        flags:
          terminate_on_error: true
          wait_for_current_time_update: false

        connections:
          endpoints: []
          subscribes:
            - key: "P_gen"
              type: "double"
              units: "W"
              targets:
                '0': [pv_federate.0/PV_power]

            - key: "P_load"
              type: "double"
              units: "W"
              targets:
                '0': [load_federate.0/P_load]

            - key: "SOC"
              type: "double"
              units: "-"
              targets:
                '0': [battery_federate.0/SOC]
              causality: "next_step"
          publishes:
            - key: "Battery_power"
              type: "double"
              units: "W"

        model_configs:
          instantiation:
            model_name: "rb_bems"
            n_instances: 1
            parallel_execution: false

          parameters:
            SOC_min: 0.40
            SOC_max: 0.65

          init_state:
            Battery_power: 0.0

          user_defined: {}

      # -----------------------------------------------------------------------
      # PV federate — SPAWNED REMOTELY via host: local_box
      # -----------------------------------------------------------------------
      pv_federate:
        name: "pv_federate"
        type: "base"
        host: "local_box"            # NEW: run this federate on the `local_box` machine
        core_name: "fed3"
        core_type: "zmq"
        log_level: ERROR


        timing_configs:
          real_period: 3600
          time_offset: 0.2

        flags:
          terminate_on_error: true
          wait_for_current_time_update: false

        connections:
          endpoints: []
          subscribes:
            - key: "T_ext"
              type: "double"
              units: "°C"
              targets:
                '0': [weather_federate.0/DryBulb]
            - key: "GHI"
              type: "double"
              units: "W/m²"
              targets:
                '0': [weather_federate.0/GloHorzRad]
            - key: "DHI"
              type: "double"
              units: "W/m²"
              targets:
                '0': [weather_federate.0/DifHorzRad]
          publishes:
            - key: "PV_power"
              type: "double"
              units: "W"


        model_configs:
          instantiation:
            model_name: "pv_dest"
            n_instances: 1
            prefix: "pv"
            parallel_execution: false

          parameters:
            lat: [39.8]
            long: [116.467]
            calc_area: [50]
            Tilt_angle: [0.6981317010]
            Azimuth_angle: [0.9]
            area_ratio: [1]
            SVF_hori: [1]
            Reflectance: [0.2]
            NOCT: [45]
            Power_rated_pv: [410]
            length: [2.05]
            width: [1.02]
            solar_constant: [1353]
            std_long: [120]

          init_state: {}

          user_defined:
            integrator: "fixed-step"

      # -----------------------------------------------------------------------
      # Battery federate (LOCAL)
      # -----------------------------------------------------------------------
      battery_federate:
        name: "battery_federate"
        type: "base"
        core_name: "fed4"
        core_type: "zmq"
        log_level: ERROR
        startup_sync:
          required_inputs: ["Battery_power", "P_load", "PV_power"]
          missing_inputs_policy: "warn"
        timing_configs:
          real_period: 3600
          time_offset: 0.4

        flags:
          terminate_on_error: true
          wait_for_current_time_update: false

        connections:
          endpoints: []
          subscribes:
            - key: "Battery_power"
              type: "double"
              units: "W"
              targets:
                '0': [rb_controller.0/Battery_power]
            - key: "P_load"
              type: "double"
              units: "W"
              targets:
                '0': [load_federate.0/P_load]
            - key: "PV_power"
              type: "double"
              units: "W"
              targets:
                '0': [pv_federate.0/PV_power]

          publishes:
            - key: "SOC"
              type: "double"
              units: "-"
            - key: "P_net"
              type: "double"
              units: "W"
            - key: "P_clipped"
              type: "double"
              units: "W"

        model_configs:
          instantiation:
            model_name: "battery_dest"
            n_instances: 1
            parallel_execution: false

          parameters:
            rated_capacity: 40000
            maximum_charge_power: 8000
            maximum_discharge_power: 8000
            SOC_upper_limit: 0.95
            SOC_lower_limit: 0.25
            charge_efficiency: 1
            discharge_efficiency: 1
            self_discharge_rate: 0
            SOC: 0.75


          init_state:
            SOC: 0.75

          user_defined:
            integrator: "euler"

      # -----------------------------------------------------------------------
      # Electric load federate (LOCAL)
      # -----------------------------------------------------------------------
      load_federate:
        name: "load_federate"
        type: "base"
        log_level: ERROR
        core_name: "fed5"
        core_type: "zmq"

        timing_configs:
          real_period: 3600
          time_offset: 0.1

        flags:
          terminate_on_error: true
          wait_for_current_time_update: false

        connections:
          endpoints: []
          subscribes: []
          publishes:
            - key: "P_load"
              type: "double"
              units: "W"

        model_configs:
          instantiation:
            model_name: "base_csv_reader"
            n_instances: 1
            prefix: "load"
            parallel_execution: false

          parameters:
            csv_path: "model_catalog/physical_models/resources/electric_load_profile_hour.csv"  # relative to model script dir
            skip_rows: 0

          init_state:
            P_load: 0.0

          user_defined:
            integrator: "fixed-step"
