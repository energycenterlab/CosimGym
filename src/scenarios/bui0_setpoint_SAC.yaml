# Example 1 (SAC): RL control of the BUI0 EnergyPlus FMU zone heating set-point.
#
# Same federation as bui0_fmu_test, but the ZoneSetPoint is now an RL ACTION instead of a
# feeder schedule: the feeder publishes only the 5 internal-gain schedules; the RL agent
# (rl_simple_SACsb3) publishes ZoneSetPoint. The agent observes the resulting zone temperature
# TBuilding (next_step, breaks the agent<->FMU same-step loop) plus HeatingLoadTarget as an
# 'extra' observation used by the reward's energy term but not exposed to the policy.
#
# Brokers use tcp (the zmq hierarchy-broker path is currently broken for multi-federation; RL
# always adds rl_federation -> hierarchy broker). FMU step is fixed at 600 s; episode_length
# 144 = one simulated day.

version: "1.0.0"
name: "bui0_setpoint_SAC"
scenario_description: "RL (SAC/SB3) control of BUI0 EnergyPlus FMU zone set-point."

start_time: "2024-01-01T00:00:00"
end_time: "2024-01-02T00:00:00"
log_level: INFO

memory_config:
  batch_size: 1000
  attrs: ["PeopleNumber", "LightsWatt", "EEquipWatt", "OthEquRadWatt",
          "OthEquFCWatt", "ZoneSetPoint", "TBuilding", "HeatingLoadTarget"]

synchronization:
  auto_offset:
    enabled: true
    offset_step: 0.1
    override_existing_offsets: false
  default_subscription_causality: "next_step"

reinforcement_learning_config:
  seed: 42
  environment:
    observations:
      federation_1.building_federate.0.TBuilding:
        causality: next_step
        reset_default: 20.0
        bounds: [0.0, 40.0]
    actions:
      federation_1.building_federate.0.ZoneSetPoint:
        space: box
        bounds: [16.0, 24.0]
    reward: models.model_catalog.RL_agents.reward_functions.bui0_setpoint_comfort
    reset:
      # EnergyPlus FMU cannot re-initialize mid-run, so episodes run contiguously
      # (no per-episode model reset). The agent still segments episodes internally.
      mode: none
  agent:
    model_name: rl_simple_SACsb3
    backend: stable_baselines3
    algorithm: SAC
    policy: MultiInputPolicy
    hyperparameters:
      learning_rate: 0.001
      gamma: 0.99
      batch_size: 64
      train_frequency: 1
      gradient_steps: 1
    params:
      target_update_interval: 5
      replay_buffer:
        buffer_size: 100000
        prefill_steps: 50
  run:
    mode: online
    train:
      episodes: 3
      episode_length: 144
    test:
      episodes: 1
      episode_length: 144
      deterministic: true
  experiment:
    name: bui0_setpoint_SAC
    checkpoint:
      best: best_bui0_sac.pth

federations:
  federation_1:
    broker_config:
      core_type: "tcp"

    federate_configs:

      # Feeder – the 5 internal-gain schedules ONLY (ZoneSetPoint is now an RL action)
      feeder_federate:
        name: "feeder_federate"
        type: "base"
        log_level: INFO

        timing_configs:
          real_period: 600

        flags:
          terminate_on_error: true
          wait_for_current_time_update: false

        connections:
          endpoints: []
          subscribes: []
          publishes:
            - key: "PeopleNumber"
              type: "double"
              units: "-"
            - key: "LightsWatt"
              type: "double"
              units: "W"
            - key: "EEquipWatt"
              type: "double"
              units: "W"
            - key: "OthEquRadWatt"
              type: "double"
              units: "W"
            - key: "OthEquFCWatt"
              type: "double"
              units: "W"

        model_configs:
          instantiation:
            model_name: "bui0_input_feeder"
            n_instances: 1
            prefix: "feed"
            parallel_execution: false

          parameters:
            occupied_start_hour: 8.0
            occupied_end_hour: 18.0
            people_occupied: 4.0
            lights_peak_w: 400.0
            lights_base_w: 40.0
            eequip_peak_w: 500.0
            eequip_base_w: 50.0
            otheq_rad_peak_w: 100.0
            otheq_rad_base_w: 0.0
            otheq_fc_peak_w: 100.0
            otheq_fc_base_w: 0.0
            setpoint_day_c: 21.0
            setpoint_night_c: 18.0

          init_state:
            PeopleNumber: 0.0
            LightsWatt: 40.0
            EEquipWatt: 50.0
            OthEquRadWatt: 0.0
            OthEquFCWatt: 0.0

          user_defined: {}

      # Building – BUI0 EnergyPlus FMU. ZoneSetPoint subscription has NO target: the RL
      # ScenarioManager wires it to the rl_agent publication automatically.
      building_federate:
        name: "building_federate"
        type: "base"
        log_level: INFO

        timing_configs:
          real_period: 600

        flags:
          terminate_on_error: true
          wait_for_current_time_update: false

        connections:
          endpoints: []
          subscribes:
            - key: "PeopleNumber"
              type: "double"
              units: "-"
              targets:
                '0': [feeder_federate.0/PeopleNumber]
            - key: "LightsWatt"
              type: "double"
              units: "W"
              targets:
                '0': [feeder_federate.0/LightsWatt]
            - key: "EEquipWatt"
              type: "double"
              units: "W"
              targets:
                '0': [feeder_federate.0/EEquipWatt]
            - key: "OthEquRadWatt"
              type: "double"
              units: "W"
              targets:
                '0': [feeder_federate.0/OthEquRadWatt]
            - key: "OthEquFCWatt"
              type: "double"
              units: "W"
              targets:
                '0': [feeder_federate.0/OthEquFCWatt]
            - key: "ZoneSetPoint"
              type: "double"
              units: "degC"
          publishes:
            - key: "TBuilding"
              type: "double"
              units: "degC"
            - key: "HeatingLoadTarget"
              type: "double"
              units: "W"

        model_configs:
          instantiation:
            model_name: "bui0_building_fmu"
            n_instances: 1
            prefix: "bui"
            parallel_execution: false

          parameters: {}

          init_state:
            PeopleNumber: 0.0
            LightsWatt: 0.0
            EEquipWatt: 0.0
            OthEquRadWatt: 0.0
            OthEquFCWatt: 0.0
            ZoneSetPoint: 20.0
            TBuilding: 20.0
            HeatingLoadTarget: 0.0

          user_defined: {}
