# M1 outbound-mirror smoke test (digitaltwin_interfaces plan):
# spring_federate carries `streaming: {stream: true}` — its inputs/outputs must show
# up live on `cosim/<sim_id>/spring_federate/#` over MQTT while the co-sim results
# stay identical to a run with stream:false (M0's scenario). input_federate has no
# `streaming` block at all, proving the opt-in default is still off elsewhere.

version: "1.0.0"
name: "m1_stream_smoke_test"
scenario_description: M1 check — streaming.stream:true federate mirrors live values to MQTT.

start_time: "2024-01-01T00:00:00"
end_time: "2024-01-01T00:05:00"
log_level: DEBUG

memory_config:
  batch_size: 1000
  attrs: ["position", "velocity", "force", "disturbance"]

federations:
  federation_1:
    broker_config:
      core_type: "zmq"
      port: 23498
      federates: 2
      log_level: DEBUG

    federate_configs:
      spring_federate:
        name: "spring_federate"
        type: "base"
        log_level: DEBUG
        core_name: "fed1"
        core_type: "zmq"

        timing_configs:
          real_period: 1

        flags:
          terminate_on_error: true
          wait_for_current_time_update: true

        streaming:
          stream: true
          every_n_ticks: 1

        connections:
          endpoints: []
          subscribes:
            - key: "force"
              type: "double"
              units: "N"
              targets:
                '0': [input_federate.0/force]
            - key: "disturbance"
              type: "double"
              units: "N"
              targets:
                '0': [input_federate.0/disturbance]

          publishes:
            - key: "position"
              type: "double"
              units: "N"
            - key: "velocity"
              type: "double"
              units: "N"

        model_configs:
          instantiation:
            model_name: "spring_mass_damper"
            n_instances: 1
            prefix: "spring"
            parallel_execution: false

          parameters:
            mass: 5
            damping: 2.0
            stiffness: 10.0

          init_state:
            force: 10.0
            disturbance: 0.0
            position: 0.0
            velocity: 0.0

          user_defined:
            solver: "rk4"
            integrator: "fixed-step"

      input_federate:
        name: "input_federate"
        type: "base"
        log_level: DEBUG
        core_name: "fed1"
        core_type: "zmq"

        timing_configs:
          real_period: 1

        flags:
          terminate_on_error: true

        connections:
          endpoints: []
          subscribes: []
          publishes:
            - key: "force"
              type: "double"
              units: "N"
            - key: "disturbance"
              type: "double"
              units: "N"

        model_configs:
          instantiation:
            model_name: "inputs4spring"
            n_instances: 1
            prefix: "input"
            parallel_execution: false

          init_state: {}
          params: {}
