version: "1.0.0"
name: "pandapower_grid_test_base"
scenario_description: >
  IEEE case14 power flow driven by a sinusoidal load-scaling signal.
  Observes bus voltages, line loadings, convergence, and system losses.

start_time: "2024-01-01T00:00:00"
end_time:   "2024-01-01T03:00:00"
log_level: ERROR

memory_config:
  batch_size: 1000
  attrs:
    - "res.bus.0.vm_pu"
    - "res.bus.3.vm_pu"
    - "res.line.0.loading_percent"
    - "convergence"
    - "total_loss_mw"
    - "total_gen_mw"
    - "total_load_mw"
    - "signal_float"

synchronization:
  auto_offset:
    enabled: true
    offset_step: 0.1
    override_existing_offsets: false
  default_subscription_causality: "same_step"
  validate_causality_cycles: true
  default_startup_sync:
    enabled: true
    force_read_all_subscriptions: true
    require_updated_inputs: false
    missing_inputs_policy: "warn"

federations:
  federation_1:
    broker_config:
      core_type: "zmq"
      port: 23420
      host: "localhost"
      federates: 2
      log_level: ERROR

    federate_configs:

      # Generates a sinusoidal float signal used to drive load.0.p_mw
      load_driver_federate:
        name: "load_driver_federate"
        type: "base"
        log_level: ERROR
        core_name: "fed_load_driver"
        core_type: "zmq"
        timing_configs:
          real_period: 3600
        flags:
          terminate_on_error: true
          wait_for_current_time_update: false
        connections:
          endpoints: []
          subscribes: []
          publishes:
            - key: "signal_float"
              type: "double"
              units: "MW"
        model_configs:
          instantiation:
            model_name: "test_input_model"
            n_instances: 1
            prefix: "driver"
            parallel_execution: false
          parameters:
            amplitude: 50.0
            period: 6.0
            bool_toggle_every: 5
            int_max: 100
          init_state:
            signal_float: 0.0
          user_defined: {}

      # pandapower IEEE case14 grid — subscribes to signal_float as load.0.p_mw
      grid_federate:
        name: "grid_federate"
        type: "base"
        log_level: ERROR
        core_name: "fed_grid"
        core_type: "zmq"
        timing_configs:
          real_period: 3600
          time_offset: 0.1
        flags:
          terminate_on_error: true
          wait_for_current_time_update: false
        connections:
          endpoints: []
          subscribes:
            - key: "load.0.p_mw"
              type: "double"
              units: "MW"
              targets:
                '0': [load_driver_federate.0/signal_float]
          publishes:
            - key: "res.bus.0.vm_pu"
              type: "double"
              units: "p.u."
            - key: "res.bus.3.vm_pu"
              type: "double"
              units: "p.u."
            - key: "res.line.0.loading_percent"
              type: "double"
              units: "%"
            - key: "convergence"
              type: "double"
              units: "-"
            - key: "total_loss_mw"
              type: "double"
              units: "MW"
            - key: "total_gen_mw"
              type: "double"
              units: "MW"
            - key: "total_load_mw"
              type: "double"
              units: "MW"
        model_configs:
          instantiation:
            model_name: "pandapower_grid"
            n_instances: 1
            prefix: "grid"
            parallel_execution: false
          parameters:
            case_file: "case14"
            case_file_format: "builtin"
            solver_mode: "pf"
            pf_algorithm: "nr"
            fail_on_divergence: false
          init_state: {}
          user_defined: {}
