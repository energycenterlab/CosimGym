# M5 BK4 demo, side (a) — fully simulated (digitaltwin_interfaces plan).
# input_federate is a normal `type: base` model federate (inputs4spring: constant force=10,
# randomized disturbance). Compare against m5_bk4_demo_b_digital_twin.yaml, where only
# input_federate's block changes (type: base -> type: interface) — spring_federate's YAML
# below is byte-identical between the two files, demonstrating the BK4 config-only swap.

version: "1.0.0"
name: "m5_bk4_demo_a_full_sim"
scenario_description: M5 BK4 demo (a) — input_federate is a real physics model, fully simulated (no external process).

start_time: "2024-01-01T00:00:00"
end_time: "2024-01-01T00:00:20"
log_level: INFO

memory_config:
  batch_size: 1000
  attrs: ["position", "velocity", "force", "disturbance"]

federations:
  federation_1:
    broker_config:
      core_type: "zmq"
      port: 23497
      federates: 2
      log_level: INFO

    federate_configs:
      spring_federate:
        name: "spring_federate"
        type: "base"
        log_level: INFO
        core_name: "fed1"
        core_type: "zmq"

        timing_configs:
          real_period: 1

        flags:
          terminate_on_error: true
          wait_for_current_time_update: true

        connections:
          endpoints: []
          subscribes:
            - key: "force"
              type: "double"
              units: "N"
              targets:
                '0': [input_federate.0/force]
            - key: "disturbance"
              type: "double"
              units: "N"
              targets:
                '0': [input_federate.0/disturbance]

          publishes:
            - key: "position"
              type: "double"
              units: "N"
            - key: "velocity"
              type: "double"
              units: "N"

        model_configs:
          instantiation:
            model_name: "spring_mass_damper"
            n_instances: 1
            prefix: "spring"
            parallel_execution: false

          parameters:
            mass: 5
            damping: 2.0
            stiffness: 10.0

          init_state:
            force: 10.0
            disturbance: 0.0
            position: 0.0
            velocity: 0.0

          user_defined:
            solver: "rk4"
            integrator: "fixed-step"

      input_federate:
        name: "input_federate"
        type: "base"
        log_level: INFO
        core_name: "fed1"
        core_type: "zmq"

        timing_configs:
          real_period: 1

        flags:
          terminate_on_error: true

        connections:
          endpoints: []
          subscribes: []
          publishes:
            - key: "force"
              type: "double"
              units: "N"
            - key: "disturbance"
              type: "double"
              units: "N"

        model_configs:
          instantiation:
            model_name: "inputs4spring"
            n_instances: 1
            prefix: "input"
            parallel_execution: false

          init_state: {}
          params: {}
