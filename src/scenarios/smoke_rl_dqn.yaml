# Fast RL smoke scenario for the pre-merge regression suite.
# Same wiring as simple_DQN_test but 2 train episodes x 20 steps (not 1000x100)
# so it exercises the full online-training path (env reset, agent update, HELICS
# action/obs routing, checkpoint) in seconds. NOT for real training.

version: "1.0.0"
name: "smoke_rl_dqn"
scenario_description: Fast RL online-training smoke test (custom DQN), regression suite.

start_time: "2024-01-01T00:00:00"
end_time: "2024-01-01T01:00:00"
log_level: WARNING

memory_config:
  batch_size: 100
  attrs: ["position", "velocity", "acceleration", "force", "disturbance"]

reinforcement_learning_config:
  environment:
    observations:
      federation_1.spring_federate.0.position:
        causality: next_step
      federation_1.spring_federate.0.velocity:
        causality: next_step
      federation_1.spring_federate.0.acceleration:
        causality: next_step
    actions:
      federation_1.spring_federate.0.force:
        space: discrete
        bins: 5
    reward: models.model_catalog.RL_agents.reward_functions.spring_oscillation_reward
  agent:
    model_name: rl_simple_DQN
    backend: custom_torch
    algorithm: DQN
    hyperparameters:
      gamma: 0.99
      batch_size: 64
      learning_rate: 0.001
    params:
      gradient_clip: 10.0
      target_update_interval: 100
      exploration:
        strategy: epsilon_greedy
        initial_epsilon: 1.0
        final_epsilon: 0.05
        epsilon_decay_steps: 50
      replay_buffer:
        buffer_size: 1000
        prefill_steps: 10
  run:
    train:
      episodes: 2
      episode_length: 20
    test:
      episodes: 1
      episode_length: 20
      deterministic: true
  experiment:
    name: smoke_rl_dqn
    checkpoint:
      best: best_smoke_dqn.pth
federations:
  federation_1:
    broker_config:
      core_type: "tcp"
      port: 23404
      federates: 1
      log_level: WARNING

    federate_configs:
      spring_federate:
          name: "spring_federate"
          type: "base"
          log_level: WARNING
          core_name: "fed1"
          core_type: "zmq"

          timing_configs:
            real_period: 1

          flags:
            terminate_on_error: true
            wait_for_current_time_update: true

          connections:
            endpoints: []
            subscribes:
              - key: "force"
                type: "double"
                units: "N"

            publishes:
              - key: "position"
                type: "double"
                units: "m"
              - key: "velocity"
                type: "double"
                units: "m/s"
              - key: "acceleration"
                type: "double"
                units: "m/s^2"

          model_configs:
            instantiation:
              model_name: "spring_mass_damper"
              n_instances: 1
              prefix: "spring"
              parallel_execution: false

            parameters:
              mass: 5.0
              damping: 2.0
              stiffness: 10.0

            init_state:
              force: 0.0
              disturbance: 0.0
              position: 0.0
              velocity: 0.0
              acceleration: 0.0

            user_defined:
              solver: "euler"
              integrator: "fixed-step"
