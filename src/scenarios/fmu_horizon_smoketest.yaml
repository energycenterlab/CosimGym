# BUI0 EnergyPlus FMU test scenario
#
# Data flow:
#   feeder_federate (bui0_input_feeder, pure Python)
#       → PeopleNumber / LightsWatt / EEquipWatt / OthEquRadWatt
#         / OthEquFCWatt / ZoneSetPoint
#       → building_federate (bui0_building_fmu, FMI 2.0 EnergyPlus FMU)
#       → TBuilding / HeatingLoadTarget
#
# Horizon test: the BUI0 FMU really runs for a year, but this scenario overrides
# max_sim_time to a single day so the restart-at-horizon path runs in seconds
# instead of a simulated year. The run covers 3 days (432 steps of 600 s), so the
# FMU is restarted twice, each logged as "reached its 86400.0s simulation
# horizon", with TBuilding jumping back to its initial condition at every one.
#
# The horizon must be a whole number of days: EnergyPlus rejects a run period
# that is not a multiple of 86400 s at fmi2EnterInitializationMode.
#
# The FMU is generated from BUI0.idf with idf-to-fmu-export-prep. The IDF uses
# 6 timesteps/hour, so the communication step is fixed at 600 s
# (canHandleVariableCommunicationStepSize=false) — both federates use
# real_period 600. One simulated day = 144 steps.

version: "1.0.0"
name: "fmu_horizon_smoketest"
scenario_description: "Exercises the automatic FMU restart at a simulation horizon. Same wiring as bui0_fmu_test, but the building FMU declares a 6-hour horizon (36 steps of 600 s) so a 1-day run restarts it 3 times. Keeps the restart path testable without waiting for a real one-year limit."

start_time: "2024-01-01T00:00:00"
end_time: "2024-01-04T00:00:00"
log_level: INFO

memory_config:
  batch_size: 1000
  attrs: ["PeopleNumber", "LightsWatt", "EEquipWatt", "OthEquRadWatt",
          "OthEquFCWatt", "ZoneSetPoint", "TBuilding", "HeatingLoadTarget", "HeatingSeason"]

synchronization:
  auto_offset:
    enabled: true
    offset_step: 0.1
    override_existing_offsets: false
  default_subscription_causality: "next_step"

federations:
  federation_1:

    federate_configs:

      # -----------------------------------------------------------------
      # Feeder federate – generates the six FMU input schedules
      # -----------------------------------------------------------------
      feeder_federate:
        name: "feeder_federate"
        type: "base"
        log_level: INFO

        timing_configs:
          real_period: 600

        flags:
          terminate_on_error: true
          wait_for_current_time_update: false

        connections:
          endpoints: []
          subscribes: []
          publishes:
            - key: "PeopleNumber"
              type: "double"
              units: "-"
            - key: "LightsWatt"
              type: "double"
              units: "W"
            - key: "EEquipWatt"
              type: "double"
              units: "W"
            - key: "OthEquRadWatt"
              type: "double"
              units: "W"
            - key: "OthEquFCWatt"
              type: "double"
              units: "W"
            - key: "ZoneSetPoint"
              type: "double"
              units: "degC"
            - key: "HeatingSeason"
              type: "double"
              units: "-"

        model_configs:
          instantiation:
            model_name: "bui0_input_feeder"
            n_instances: 1
            prefix: "feed"
            parallel_execution: false

          parameters:
            occupied_start_hour: 8.0
            occupied_end_hour: 18.0
            people_occupied: 4.0
            lights_peak_w: 400.0
            lights_base_w: 40.0
            eequip_peak_w: 500.0
            eequip_base_w: 50.0
            otheq_rad_peak_w: 100.0
            otheq_rad_base_w: 0.0
            otheq_fc_peak_w: 100.0
            otheq_fc_base_w: 0.0
            heating_season_start_month: 10
            heating_season_end_month: 4
            heating_setpoint_day_c: 21.0
            heating_setpoint_night_c: 18.0
            cooling_season_mode: setback
            cooling_season_setback_c: 12.0

          init_state:
            PeopleNumber: 0.0
            LightsWatt: 40.0
            EEquipWatt: 50.0
            OthEquRadWatt: 0.0
            OthEquFCWatt: 0.0
            ZoneSetPoint: 18.0

          # No horizon declared here on purpose: the scenario's horizon comes from
          # the building FMU below, and every federate is restarted with it. The
          # feeder rewinds together with the building without knowing about it.
          user_defined: {}

      # -----------------------------------------------------------------
      # Building federate – BUI0 EnergyPlus FMU (FMI 2.0)
      # -----------------------------------------------------------------
      building_federate:
        name: "building_federate"
        type: "base"
        log_level: INFO

        timing_configs:
          real_period: 600

        flags:
          terminate_on_error: true
          wait_for_current_time_update: false

        connections:
          endpoints: []
          subscribes:
            - key: "PeopleNumber"
              type: "double"
              units: "-"
              targets:
                '0': [feeder_federate.0/PeopleNumber]
            - key: "LightsWatt"
              type: "double"
              units: "W"
              targets:
                '0': [feeder_federate.0/LightsWatt]
            - key: "EEquipWatt"
              type: "double"
              units: "W"
              targets:
                '0': [feeder_federate.0/EEquipWatt]
            - key: "OthEquRadWatt"
              type: "double"
              units: "W"
              targets:
                '0': [feeder_federate.0/OthEquRadWatt]
            - key: "OthEquFCWatt"
              type: "double"
              units: "W"
              targets:
                '0': [feeder_federate.0/OthEquFCWatt]
            - key: "ZoneSetPoint"
              type: "double"
              units: "degC"
              targets:
                '0': [feeder_federate.0/ZoneSetPoint]
          publishes:
            - key: "TBuilding"
              type: "double"
              units: "degC"
            - key: "HeatingLoadTarget"
              type: "double"
              units: "W"

        model_configs:
          instantiation:
            model_name: "bui0_building_fmu"
            n_instances: 1
            prefix: "bui"
            parallel_execution: false

          parameters: {}

          init_state:
            PeopleNumber: 0.0
            LightsWatt: 0.0
            EEquipWatt: 0.0
            OthEquRadWatt: 0.0
            OthEquFCWatt: 0.0
            ZoneSetPoint: 20.0
            TBuilding: 0.0
            HeatingLoadTarget: 0.0

          user_defined:
            # Seconds of model-local simulated time before the FMU must be
            # restarted. Normally declared in the catalog entry (this FMU's real
            # RunPeriod is a full year); overridden here to make the restart
            # observable in a short run. Must be a multiple of 86400 for an
            # EnergyPlus export.
            max_sim_time: 86400
            sim_start_date: "01-01"
