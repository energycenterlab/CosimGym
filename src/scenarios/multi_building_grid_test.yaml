            u_walls:     [0.15, 0.20, 0.15, 0.25, 0.18, 0.30, 0.15, 0.22, 0.20, 0.25]
            u_windows:   [1.1,  1.0,  1.1,  1.3,  1.0,  1.5,  0.9,  1.2,  1.0,  1.4]
            ach_vent:    [1.5,  1.2,  1.8,  1.5,  1.0,  2.0,  1.5,  1.3,  1.8,  1.0]
            t_set_heating: [21, 20, 22, 21, 20, 21, 22, 19, 20, 21]
            t_set_cooling: [25, 26, 24, 26, 25, 25, 24, 26, 25, 25]
            cop_heating: [3.5, 4.0, 3.5, 3.8, 3.2, 4.0, 3.5, 3.0, 3.2, 4.0]
            thermal_capacitance_per_floor_area: [165000, 140000, 200000, 150000, 180000, 120000, 165000, 145000, 190000, 130000]
            max_heating_power_per_floor_area:   [500, 500, 500, 450, 500, 400, 500, 450, 500, 400]
