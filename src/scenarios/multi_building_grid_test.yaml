        flags:
          terminate_on_error: true
          wait_for_current_time_update: false
        connections:
          endpoints: []
          subscribes:
            - key: "T_ext"
              type: "double"
              units: "°C"
              targets: [weather_federate.0/T_ext]
          publishes:
            - key: "T_indoor"
              type: "double"
              units: "°C"
            - key: "Q_heating"
              type: "double"
              units: "W"
            - key: "P_elec_mw"
              type: "double"
              units: "MW"
        model_configs:
          instantiation:
            model_name: "rc_building"
            n_instances: 10
            prefix: "bld1"
            parallel_execution: false
          parameters:
            floor_area:  [200, 150, 250, 180, 300, 120, 220, 160, 280, 140]
            window_area: [24,  18,  30,  22,  36,  14,  26,  19,  34,  17]
            walls_area:  [60,  45,  75,  54,  90,  36,  66,  48,  84,  42]
            room_vol:    [600, 450, 750, 540, 900, 360, 660, 480, 840, 420]
