            total_internal_area: [2700, 8100, 1800, 9000, 3600, 7200, 2250, 6300, 3150, 9900]
            u_walls:     [0.20, 0.35, 0.45, 0.22, 0.15, 0.30, 0.40, 0.25, 0.28, 0.18]
