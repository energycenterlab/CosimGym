              type: "double"
              units: "°C"
            - key: "Q_heating"
              type: "double"
              units: "W"
            - key: "P_elec_mw"
              type: "double"
              units: "MW"
        model_configs:
          instantiation:
            model_name: "rc_building"
            n_instances: 10
