version: "1.0.0"
name: "multi_building_grid_test"
scenario_description: >
  50 RC-building thermal models connected as electrical loads to an IEEE case14 power grid.
  5 building federates × 10 RC instances each; buildings span residential (120 m²) to
  industrial (10000 m²) with varied insulation, setpoints and COP. Each federate's
  aggregate P_elec_mw (sum of 10 instances via HELICS multi-input SUM) drives one
  case14 load bus per federate. Weather from weather_TO.csv (Turin, Jan data cycling).
  Simulation: 1 month / 1-hour timestep.

start_time: "2024-01-01T00:00:00"
end_time:   "2024-02-01T00:00:00"
log_level: ERROR

memory_config:
  batch_size: 1000
  attrs: "all"

synchronization:
  auto_offset:
    enabled: true
    offset_step: 0.1
    override_existing_offsets: false
  default_subscription_causality: "same_step"
  validate_causality_cycles: true
  default_startup_sync:
    enabled: true
    force_read_all_subscriptions: true
    require_updated_inputs: false
    missing_inputs_policy: "warn"

federations:
  federation_1:
    broker_config:
      core_type: "zmq"
      port: 23422
      host: "localhost"
      federates: 7
      log_level: ERROR

    federate_configs:

      # ── Weather ──────────────────────────────────────────────────────────
      weather_federate:
        name: "weather_federate"
        type: "base"
        log_level: ERROR
        core_name: "fed_weather"
        core_type: "zmq"
        timing_configs:
          real_period: 3600
        flags:
          terminate_on_error: true
          wait_for_current_time_update: false
        connections:
          endpoints: []
          subscribes: []
          publishes:
            - key: "T_ext"
              type: "double"
              units: "°C"
        model_configs:
          instantiation:
            model_name: "weather_csv_reader"
            n_instances: 1
            prefix: "weather"
            parallel_execution: false
          parameters:
            csv_path: "resources/weather_TO.csv"
            column: "T_ext"
            skip_rows: 0
          init_state: {}
          user_defined: {}

      # ── Building Federate 1 — 10 residential (120–300 m²) ────────────────
      building_federate_1:
        name: "building_federate_1"
        type: "base"
        log_level: ERROR
        core_name: "fed_bld1"
        core_type: "zmq"
        timing_configs:
