      # ── Grid ─────────────────────────────────────────────────────────────
      # case14: 11 loads. Loads 0-4 driven by sum of 10 buildings each.
      # Loads 5-10 remain at case14 default values.
      grid_federate:
        name: "grid_federate"
        type: "base"
        log_level: ERROR
        core_name: "fed_grid"
        core_type: "zmq"
        timing_configs:
          real_period: 3600
          time_offset: 0.5
        flags:
          terminate_on_error: true
          wait_for_current_time_update: false
        connections:
          endpoints: []
          subscribes:
            # Load 0 ← sum of building_federate_1 instances 0-9
            - key: "load.0.p_mw"
              type: "double"
              units: "MW"
              multi_input_handling: "sum"
              targets:
                '0':
                  - building_federate_1.0/P_elec_mw
                  - building_federate_1.1/P_elec_mw
                  - building_federate_1.2/P_elec_mw
                  - building_federate_1.3/P_elec_mw
                  - building_federate_1.4/P_elec_mw
                  - building_federate_1.5/P_elec_mw
                  - building_federate_1.6/P_elec_mw
                  - building_federate_1.7/P_elec_mw
                  - building_federate_1.8/P_elec_mw
                  - building_federate_1.9/P_elec_mw
            # Load 1 ← sum of building_federate_2 instances 0-9
            - key: "load.1.p_mw"
              type: "double"
              units: "MW"
              multi_input_handling: "sum"
              targets:
                '0':
                  - building_federate_2.0/P_elec_mw
                  - building_federate_2.1/P_elec_mw
                  - building_federate_2.2/P_elec_mw
                  - building_federate_2.3/P_elec_mw
                  - building_federate_2.4/P_elec_mw
                  - building_federate_2.5/P_elec_mw
                  - building_federate_2.6/P_elec_mw
                  - building_federate_2.7/P_elec_mw
                  - building_federate_2.8/P_elec_mw
                  - building_federate_2.9/P_elec_mw
            # Load 2 ← sum of building_federate_3 instances 0-9
