            cop_heating: [3.2, 2.8, 3.5, 2.5, 4.0, 3.0, 2.8, 3.5, 3.0, 3.8]
            thermal_capacitance_per_floor_area: [155000, 185000, 145000, 200000, 165000, 180000, 150000, 190000, 160000, 210000]
