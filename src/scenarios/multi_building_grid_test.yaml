        name: "building_federate_5"
        type: "base"
        log_level: ERROR
        core_name: "fed_bld5"
        core_type: "zmq"
        timing_configs:
          real_period: 3600
        flags:
          terminate_on_error: true
          wait_for_current_time_update: false
        connections:
