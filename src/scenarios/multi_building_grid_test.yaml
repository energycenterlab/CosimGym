              type: "double"
              units: "MW"
              multi_input_handling: "sum"
              targets:
                '0':
                  - building_federate_3.0/P_elec_mw
                  - building_federate_3.1/P_elec_mw
                  - building_federate_3.2/P_elec_mw
                  - building_federate_3.3/P_elec_mw
                  - building_federate_3.4/P_elec_mw
                  - building_federate_3.5/P_elec_mw
                  - building_federate_3.6/P_elec_mw
                  - building_federate_3.7/P_elec_mw
                  - building_federate_3.8/P_elec_mw
                  - building_federate_3.9/P_elec_mw
            # Load 3 ← sum of building_federate_4 instances 0-9
            - key: "load.3.p_mw"
              type: "double"
              units: "MW"
              multi_input_handling: "sum"
              targets:
                '0':
                  - building_federate_4.0/P_elec_mw
                  - building_federate_4.1/P_elec_mw
                  - building_federate_4.2/P_elec_mw
                  - building_federate_4.3/P_elec_mw
                  - building_federate_4.4/P_elec_mw
                  - building_federate_4.5/P_elec_mw
                  - building_federate_4.6/P_elec_mw
                  - building_federate_4.7/P_elec_mw
                  - building_federate_4.8/P_elec_mw
                  - building_federate_4.9/P_elec_mw
            # Load 4 ← sum of building_federate_5 instances 0-9
            - key: "load.4.p_mw"
              type: "double"
              units: "MW"
              multi_input_handling: "sum"
              targets:
                '0':
                  - building_federate_5.0/P_elec_mw
                  - building_federate_5.1/P_elec_mw
                  - building_federate_5.2/P_elec_mw
                  - building_federate_5.3/P_elec_mw
                  - building_federate_5.4/P_elec_mw
                  - building_federate_5.5/P_elec_mw
                  - building_federate_5.6/P_elec_mw
                  - building_federate_5.7/P_elec_mw
                  - building_federate_5.8/P_elec_mw
                  - building_federate_5.9/P_elec_mw
          publishes:
            - key: "res.bus.0.vm_pu"
              type: "double"
              units: "p.u."
            - key: "res.bus.1.vm_pu"
              type: "double"
              units: "p.u."
            - key: "res.bus.4.vm_pu"
              type: "double"
              units: "p.u."
            - key: "res.bus.8.vm_pu"
              type: "double"
              units: "p.u."
            - key: "res.line.0.loading_percent"
              type: "double"
              units: "%"
            - key: "convergence"
              type: "double"
              units: "-"
            - key: "total_load_mw"
              type: "double"
              units: "MW"
            - key: "total_loss_mw"
              type: "double"
              units: "MW"
            - key: "total_gen_mw"
              type: "double"
              units: "MW"
        model_configs:
          instantiation:
            model_name: "pandapower_grid"
            n_instances: 1
            prefix: "grid"
            parallel_execution: false
          parameters:
            case_file: "case14"
            case_file_format: "builtin"
            solver_mode: "pf"
            pf_algorithm: "nr"
            fail_on_divergence: false
          init_state: {}
          user_defined: {}
