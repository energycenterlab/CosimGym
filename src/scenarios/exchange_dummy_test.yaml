version: "1.0.0"
name: "exchange_dummy_test"
scenario_description: >
  Comms-exchange regression test for exchange_dummy — the comms-isolating
  counterpart of heavy_compute_dummy. pub_federate's 2 instances publish a
  4-wide vector payload each tick; sub_federate's 2 instances subscribe to
  the matching pub_federate instance (per-instance targets binding) and fold
  every received value into their own accumulator. Proves HELICS actually
  transfers the payload end to end (sub_federate has no compute of its own to
  produce a non-zero payload_in without receiving it).

start_time: "2024-01-01T00:00:00"
end_time:   "2024-01-01T00:00:10"
log_level: ERROR

memory_config:
  sink: json
  attrs: "all"

synchronization:
  auto_offset:
    enabled: true
    offset_step: 0.1
    override_existing_offsets: false
  default_subscription_causality: "same_step"
  validate_causality_cycles: true

federations:
  federation_1:
    broker_config:
      core_type: "zmq"
      port: 23610
      host: "localhost"
      federates: 2
      log_level: ERROR

    federate_configs:

      pub_federate:
        name: "pub_federate"
        type: "base"
        log_level: ERROR
        core_name: "fed_pub"
        core_type: "zmq"
        timing_configs:
          real_period: 1
        flags:
          terminate_on_error: true
          wait_for_current_time_update: false
        connections:
          endpoints: []
          subscribes: []
          publishes:
            - key: "payload"
              type: "vector"
              units: "-"
        model_configs:
          instantiation:
            model_name: "exchange_dummy"
            n_instances: 2
            prefix: "px"
            parallel_execution: false
          parameters:
            msg_width: 4
            publish_every: 1
          init_state: {}
          user_defined: {}

      sub_federate:
        name: "sub_federate"
        type: "base"
        log_level: ERROR
        core_name: "fed_sub"
        core_type: "zmq"
        timing_configs:
          real_period: 1
        flags:
          terminate_on_error: true
          wait_for_current_time_update: false
        connections:
          endpoints: []
          subscribes:
            - key: "payload_in"
              type: "vector"
              units: "-"
              causality: "same_step"
              targets:
                '0': ["pub_federate.0/payload"]
                '1': ["pub_federate.1/payload"]
          publishes:
            - key: "payload"
              type: "vector"
              units: "-"
        model_configs:
          instantiation:
            model_name: "exchange_dummy"
            n_instances: 2
            prefix: "sx"
            parallel_execution: false
          parameters:
            msg_width: 4
            publish_every: 1
          init_state: {}
          user_defined: {}
