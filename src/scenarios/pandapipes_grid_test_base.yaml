version: "1.0.0"
name: "pandapipes_grid_test_base"
scenario_description: >
  Gas T-cross network (gas_tcross1) pipeflow driven by a sinusoidal sink demand signal.
  Observes junction pressures, pipe velocities, convergence, and total supply/demand.

start_time: "2024-01-01T00:00:00"
end_time:   "2024-01-01T03:00:00"
log_level: ERROR

memory_config:
  batch_size: 1000
  attrs:
    - "res.junction.0.p_bar"
    - "res.junction.1.p_bar"
    - "res.junction.2.p_bar"
    - "res.pipe.0.v_mean_m_per_s"
    - "res.pipe.0.dp_friction_loss_bar"
    - "convergence"
    - "total_supply_mdot_kg_per_s"
    - "total_demand_mdot_kg_per_s"
    - "signal_float"

synchronization:
  auto_offset:
    enabled: true
    offset_step: 0.1
    override_existing_offsets: false
  default_subscription_causality: "same_step"
  validate_causality_cycles: true
  default_startup_sync:
    enabled: true
    force_read_all_subscriptions: true
    require_updated_inputs: false
    missing_inputs_policy: "warn"

federations:
  federation_1:
    broker_config:
      core_type: "zmq"
      port: 23421
      host: "localhost"
      federates: 2
      log_level: ERROR

    federate_configs:

      # Generates a sinusoidal float signal used to drive sink.0.mdot_kg_per_s
      sink_driver_federate:
        name: "sink_driver_federate"
        type: "base"
        log_level: ERROR
        core_name: "fed_sink_driver"
        core_type: "zmq"
        timing_configs:
          real_period: 3600
        flags:
          terminate_on_error: true
          wait_for_current_time_update: false
        connections:
          endpoints: []
          subscribes: []
          publishes:
            - key: "signal_float"
              type: "double"
              units: "kg/s"
        model_configs:
          instantiation:
            model_name: "test_input_model"
            n_instances: 1
            prefix: "driver"
            parallel_execution: false
          parameters:
            amplitude: 0.001
            period: 6.0
            bool_toggle_every: 5
            int_max: 100
          init_state:
            signal_float: 0.0
          user_defined: {}

      # pandapipes gas T-cross network — subscribes to signal_float as sink.0.mdot_kg_per_s
      gas_grid_federate:
        name: "gas_grid_federate"
        type: "base"
        log_level: ERROR
        core_name: "fed_gas_grid"
        core_type: "zmq"
        timing_configs:
          real_period: 3600
          time_offset: 0.1
        flags:
          terminate_on_error: true
          wait_for_current_time_update: false
        connections:
          endpoints: []
          subscribes:
            - key: "sink.0.mdot_kg_per_s"
              type: "double"
              units: "kg/s"
              targets:
                '0': [sink_driver_federate.0/signal_float]
          publishes:
            - key: "res.junction.0.p_bar"
              type: "double"
              units: "bar"
            - key: "res.junction.1.p_bar"
              type: "double"
              units: "bar"
            - key: "res.junction.2.p_bar"
              type: "double"
              units: "bar"
            - key: "res.pipe.0.v_mean_m_per_s"
              type: "double"
              units: "m/s"
            - key: "res.pipe.0.dp_friction_loss_bar"
              type: "double"
              units: "bar"
            - key: "convergence"
              type: "double"
              units: "-"
            - key: "total_supply_mdot_kg_per_s"
              type: "double"
              units: "kg/s"
            - key: "total_demand_mdot_kg_per_s"
              type: "double"
              units: "kg/s"
        model_configs:
          instantiation:
            model_name: "pandapipes_grid"
            n_instances: 1
            prefix: "gas_grid"
            parallel_execution: false
          parameters:
            case_file: "gas_tcross1"
            case_file_format: "builtin"
            pf_mode: "hydraulics"
            max_iter_hyd: 10
            friction_model: "nikuradse"
            fail_on_divergence: false
          init_state: {}
          user_defined: {}
