# M0 scaffolding smoke test (digitaltwin_interfaces plan):
# - spring_federate carries an explicit `streaming: {stream: false}` — must behave
#   identically to a federate without the block at all (opt-in, no default change).
# - dt_bridge_empty is a `type: interface` shell with no `interface_config` — proves
#   the model-less federate type boots and shuts down cleanly (M0 check).

version: "1.0.0"
name: "m0_interface_smoke_test"
scenario_description: M0 check — stream:false federate + empty-config interface federate boot cleanly.

start_time: "2024-01-01T00:00:00"
end_time: "2024-01-01T00:05:00"
log_level: DEBUG

memory_config:
  batch_size: 1000
  attrs: ["position", "velocity", "force", "disturbance"]

federations:
  federation_1:
    broker_config:
      core_type: "zmq"
      port: 23499
      federates: 3
      log_level: DEBUG

    federate_configs:
      spring_federate:
        name: "spring_federate"
        type: "base"
        log_level: DEBUG
        core_name: "fed1"
        core_type: "zmq"

        timing_configs:
          real_period: 1

        flags:
          terminate_on_error: true
          wait_for_current_time_update: true

        streaming:
          stream: false

        connections:
          endpoints: []
          subscribes:
            - key: "force"
              type: "double"
              units: "N"
              targets:
                '0': [input_federate.0/force]
            - key: "disturbance"
              type: "double"
              units: "N"
              targets:
                '0': [input_federate.0/disturbance]

          publishes:
            - key: "position"
              type: "double"
              units: "N"
            - key: "velocity"
              type: "double"
              units: "N"

        model_configs:
          instantiation:
            model_name: "spring_mass_damper"
            n_instances: 1
            prefix: "spring"
            parallel_execution: false

          parameters:
            mass: 5
            damping: 2.0
            stiffness: 10.0

          init_state:
            force: 10.0
            disturbance: 0.0
            position: 0.0
            velocity: 0.0

          user_defined:
            solver: "rk4"
            integrator: "fixed-step"

      input_federate:
        name: "input_federate"
        type: "base"
        log_level: DEBUG
        core_name: "fed1"
        core_type: "zmq"

        timing_configs:
          real_period: 1

        flags:
          terminate_on_error: true

        connections:
          endpoints: []
          subscribes: []
          publishes:
            - key: "force"
              type: "double"
              units: "N"
            - key: "disturbance"
              type: "double"
              units: "N"

        model_configs:
          instantiation:
            model_name: "inputs4spring"
            n_instances: 1
            prefix: "input"
            parallel_execution: false

          init_state: {}
          params: {}

      dt_bridge_empty:
        name: "dt_bridge_empty"
        type: "interface"
        log_level: DEBUG
        core_name: "fed1"
        core_type: "zmq"

        timing_configs:
          real_period: 1

        flags:
          terminate_on_error: true
