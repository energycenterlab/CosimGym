services:
  redis:
    # Redis Open Source 8.x bundles ReJSON (the catalog/config store uses JSON.SET/JSON.GET).
    # Pinned to a patched release (allowed: 8.10.1, 8.8.2, 8.6.6, 8.4.6, 8.2.9, 7.4.11, 7.2.16, 6.2.24);
    # redis/redis-stack-server is frozen at core 7.4.7, below the floor.
    image: redis:8.10.1-alpine
    container_name: cosim_redis
    ports:
      # Host port from src/.env (COSIM_REDIS_PORT); container side stays 6379.
      - "${COSIM_REDIS_PORT:-6379}:6379"
    restart: unless-stopped
    volumes:
      - redis_data:/data
    command: redis-server --save 60 1 --loglevel verbose
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  catalog-loader:
    image: python:3.11-slim
    container_name: cosim_catalog_loader
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ../:/app
    working_dir: /app
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_URL=redis://redis:6379/0
    command: >
      sh -c "pip install --quiet --no-cache-dir redis pyyaml &&
             python src/models/model_catalog/catalog_loader.py"
    restart: "no"

  mosquitto:
    image: eclipse-mosquitto:latest
    container_name: cosim_mosquitto
    ports:
      # Host 1883 is occupied by a system-wide mosquitto service on shared servers;
      # host port from src/.env (COSIM_MQTT_PORT, default 11883); container side stays 1883.
      - "${COSIM_MQTT_PORT:-11883}:1883"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf
    restart: unless-stopped

  minio:
    # minio/minio and minio/mc are no longer published on Docker Hub; Chainguard's public images are.
    image: cgr.dev/chainguard/minio:latest
    user: root   # the image defaults to nonroot, which cannot write the fresh named volume
    container_name: cosim_minio
    ports:
      # Host ports from src/.env (COSIM_MINIO_PORT / COSIM_MINIO_CONSOLE_PORT);
      # container sides stay 9000 (API) and 9001 (console).
      - "${COSIM_MINIO_PORT:-9000}:9000"
      - "${COSIM_MINIO_CONSOLE_PORT:-9101}:9001"
    environment:
      - MINIO_ROOT_USER=cosimgym
      - MINIO_ROOT_PASSWORD=cosimgym123
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    restart: unless-stopped

  minio-init:
    image: cgr.dev/chainguard/minio-client:latest-dev
    container_name: cosim_minio_init
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 cosimgym cosimgym123; do sleep 1; done &&
      mc mb --ignore-existing local/fmus &&
      echo 'MinIO bucket ready.'
      "
    restart: "no"

volumes:
  redis_data:
  minio_data:
