    class_name: RCBuilding
    module_path: models.model_catalog.physical_models.rc_building
    version: 1.0.0
    description: Parametrizable 5R1C (ISO 13790) single-zone building thermal model,
      ported from the RC_BuildingSimulator project. Computes indoor air/mass/surface/operative
      temperatures and the ideal heating/cooling demand to hold the set-point, given
      outdoor temperature, solar gains and internal gains. Set-points are control
      inputs (drivable by a controller/RL agent).
    author: Pietro Rando Mazzarino
    domain: building_energy
    category: physical_model
    tags:
    - building
    - thermal
    - 5R1C
    - iso13790
    - rc_buildingsimulator
    dependencies: []
    time_step: 3600
    max_time_step: 3600
    min_time_step: 1
    user_defined:
      solver: crank-nicolson
      integrator: fixed-step
    parameters:
      floor_area:
        type: float
        default_value: 35.0
        description: Conditioned floor area of the zone
        unit: m^2
        min_value: 1.0
        max_value: 100000.0
        required: true
        tags:
        - geometry
      window_area:
        type: float
        default_value: 4.0
        description: Total window area
        unit: m^2
        min_value: 0.0
        max_value: 100000.0
        required: false
        tags:
        - geometry
        - envelope
      walls_area:
        type: float
        default_value: 11.0
        description: Total opaque external wall area
        unit: m^2
        min_value: 0.0
        max_value: 100000.0
        required: false
        tags:
        - geometry
        - envelope
      room_vol:
        type: float
        default_value: 105.0
        description: Air volume of the zone
        unit: m^3
        min_value: 1.0
        max_value: 1000000.0
        required: false
        tags:
        - geometry
      total_internal_area:
        type: float
        default_value: 142.0
        description: Total internal surface area (A_t) seen by the surface node
        unit: m^2
        min_value: 1.0
        max_value: 1000000.0
        required: false
        tags:
        - geometry
      u_walls:
        type: float
        default_value: 0.2
        description: Thermal transmittance of opaque walls
        unit: W/(m^2K)
        min_value: 0.01
        max_value: 5.0
        required: false
        tags:
        - envelope
      u_windows:
        type: float
        default_value: 1.1
        description: Thermal transmittance of windows
        unit: W/(m^2K)
        min_value: 0.1
        max_value: 6.0
        required: false
        tags:
        - envelope
      ach_vent:
